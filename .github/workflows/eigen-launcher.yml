name: Eigen launcher bouwen

on:
  push:
    branches: [eigen-afbeeldingen]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Altijd dezelfde ondertekensleutel, zodat een nieuwe build over de vorige heen installeert.
      - name: Vaste ondertekensleutel
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Geen DEBUG_KEYSTORE_B64: elke build krijgt een andere handtekening."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Bouwen
        working-directory: launcher
        run: |
          chmod +x gradlew
          # De Gradle-download faalt soms tijdelijk (timeout/504): tot drie pogingen.
          for i in 1 2 3; do
            ./gradlew --no-daemon assembleRelease && exit 0
            echo "Poging $i mislukt, opnieuw over 60 s"; sleep 60
          done
          exit 1
      - name: Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="eigen-${GITHUB_RUN_NUMBER}"
          cp launcher/app/build/outputs/apk/release/app-release.apk CleanYourTV-launcher-eigen-afbeeldingen.apk
          gh release create "$tag" CleanYourTV-launcher-eigen-afbeeldingen.apk \
            --target "$GITHUB_SHA" --title "Launcher met eigen afbeeldingen ($tag)" \
            --notes "Clean Your TV-launcher met eigen afbeeldingen uit files/banners/<pakketnaam>.png"
