name: Eigen launcher bouwen

on:
  push:
    branches: [eigen-afbeeldingen]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Ook op deze branch Gradle bewaren, zodat een volgende build niets hoeft te downloaden.
          cache-read-only: false
      # Altijd dezelfde ondertekensleutel, zodat een nieuwe build over de vorige heen installeert.
      - name: Vaste ondertekensleutel
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Geen DEBUG_KEYSTORE_B64: elke build krijgt een andere handtekening."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/eigen.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/eigen.keystore" -storepass android | grep "SHA256:"
          echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/eigen.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android" >> "$GITHUB_ENV"
      - name: Gradle 8.9 ophalen (met reservebron, gecontroleerd met de officiële checksum)
        run: |
          for i in 1 2 3 4 5; do
            sum=$(curl -fsSL --max-time 30 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256) || { sleep 20; continue; }
            for url in https://services.gradle.org/distributions/gradle-8.9-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip; do
              curl -fsSL --max-time 300 -o "$RUNNER_TEMP/gradle.zip" "$url" || continue
              if echo "$sum  $RUNNER_TEMP/gradle.zip" | sha256sum -c -; then
                sed -i "s#^distributionUrl=.*#distributionUrl=file\\://$RUNNER_TEMP/gradle.zip#; s#^validateDistributionUrl=.*#validateDistributionUrl=false#" launcher/gradle/wrapper/gradle-wrapper.properties
                exit 0
              fi
            done
            sleep 20
          done
          exit 1
      - name: Bouwen
        working-directory: launcher
        run: |
          chmod +x gradlew
          # De Gradle-download faalt soms tijdelijk (timeout/504): tot zes pogingen.
          for i in 1 2 3 4 5 6; do
            ./gradlew --no-daemon assembleRelease $SIGN_ARGS && exit 0
            echo "Poging $i mislukt, opnieuw over 90 s"; sleep 90
          done
          exit 1
      - name: Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="eigen-${GITHUB_RUN_NUMBER}"
          cp launcher/app/build/outputs/apk/release/app-release.apk CleanYourTV-launcher-eigen-afbeeldingen.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs CleanYourTV-launcher-eigen-afbeeldingen.apk | grep SHA-256
          gh release create "$tag" CleanYourTV-launcher-eigen-afbeeldingen.apk \
            --target "$GITHUB_SHA" --title "Launcher met eigen afbeeldingen ($tag)" \
            --notes "Clean Your TV-launcher met eigen afbeeldingen uit files/banners/<pakketnaam>.png"
